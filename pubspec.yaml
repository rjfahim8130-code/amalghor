name: amalghor
description: আমলঘর - Live Islamic Time Dashboard + Location-Based Prayer Calendar PDF Generator
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.2.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # Core
  cupertino_icons: ^1.0.8
  intl: ^0.19.0
  provider: ^6.1.2
  shared_preferences: ^2.3.2
  path_provider: ^2.1.4
  path: ^1.9.0

  # Prayer Calculation
  adhan: ^2.0.0+1

  # Location
  geolocator: ^13.0.1
  permission_handler: ^11.3.1
  geocoding: ^3.0.0

  # Local Database
  hive: ^2.2.3
  hive_flutter: ^1.1.0

  # PDF Generation
  pdf: ^3.11.1
  printing: ^5.13.2
  open_filex: ^4.5.0

  # Date & Calendar
  hijri: ^3.0.0

  # UI
  google_fonts: ^6.2.1
  flutter_svg: ^2.0.10+1
  animated_text_kit: ^4.2.2
  shimmer: ^3.0.0
  flutter_spinkit: ^5.2.1

  # Utils
  timezone: ^0.9.4
  collection: ^1.18.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  hive_generator: ^2.0.1
  build_runner: ^2.4.12

flutter:
  uses-material-design: true

  assets:
    - assets/images/
    - assets/fonts/
    - assets/quran/

  fonts:
    - family: Kalpurush
      fonts:
        - asset: assets/fonts/Kalpurush.ttf
    - family: SolaimanLipi
      fonts:
        - asset: assets/fonts/SolaimanLipi.ttf
    - family: Amiri
      fonts:
        - asset: assets/fonts/Amiri-Regular.ttf
        - asset: assets/fonts/Amiri-Bold.ttf
          weight: 700
