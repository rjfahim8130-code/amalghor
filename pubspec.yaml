name: amalghor
description: "আমলঘর — Offline Islamic Time Dashboard, Prayer Calendar & PDF Generator"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ">=3.4.0 <4.0.0"
  flutter: ">=3.24.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # State Management
  flutter_riverpod: ^2.5.1

  # Routing
  go_router: ^14.2.7

  # Prayer Time Calculation
  adhan: ^2.0.0
  hijri: ^3.0.0
  intl: ^0.19.0

  # Location
  geolocator: ^13.0.1
  flutter_timezone: ^3.0.1
  geocoding: ^3.0.0
  permission_handler: ^11.3.1

  # Storage
  sqflite: ^2.3.3
  path: ^1.9.0
  path_provider: ^2.1.4
  shared_preferences: ^2.3.2

  # PDF Generation
  pdf: ^3.11.1
  printing: ^5.13.2

  # Notifications
  flutter_local_notifications: ^17.2.2
  timezone: ^0.9.4

  # UI
  google_fonts: ^6.2.1
  flutter_svg: ^2.0.10
  cupertino_icons: ^1.0.8

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
  generate: true

  fonts:
    - family: Inter
      fonts:
        - asset: assets/fonts/Inter-Regular.ttf
        - asset: assets/fonts/Inter-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Inter-Bold.ttf
          weight: 700
    - family: Kalpurush
      fonts:
        - asset: assets/fonts/Kalpurush.ttf
    - family: NotoNaskhArabic
      fonts:
        - asset: assets/fonts/NotoNaskhArabic-Regular.ttf
        - asset: assets/fonts/NotoNaskhArabic-Bold.ttf
          weight: 700
    - family: NotoSansBengali
      fonts:
        - asset: assets/fonts/NotoSansBengali-Regular.ttf
        - asset: assets/fonts/NotoSansBengali-Bold.ttf
          weight: 700
